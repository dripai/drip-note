name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ''
            rust_target: ''
            bundle_path: src-tauri/target/release/bundle
            artifact_name: drip-note-windows-x64
          - name: Linux x64
            os: ubuntu-22.04
            args: ''
            rust_target: ''
            bundle_path: src-tauri/target/release/bundle
            artifact_name: drip-note-linux-x64
          - name: macOS arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            bundle_path: src-tauri/target/aarch64-apple-darwin/release/bundle
            artifact_name: drip-note-macos-arm64
          - name: macOS x64
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            bundle_path: src-tauri/target/x86_64-apple-darwin/release/bundle
            artifact_name: drip-note-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        run: npm install -g pnpm@11.7.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        run: pnpm tauri build ${{ matrix.args }}

      - name: Collect release bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $bundleDir = "${{ matrix.bundle_path }}"
          $patterns = @("*.msi", "*.exe", "*.deb", "*.rpm", "*.AppImage", "*.dmg", "*.zip")
          foreach ($pattern in $patterns) {
            Get-ChildItem -Path $bundleDir -Recurse -File -Filter $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path "release-assets" $_.Name) -Force
            }
          }
          $count = (Get-ChildItem -Path release-assets -File).Count
          if ($count -eq 0) {
            throw "No release bundle files found in $bundleDir"
          }

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: release-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
